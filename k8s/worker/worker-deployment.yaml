apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: distributed-autoscaler-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090   # Prometheus metrics port
          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"
            - name: REDIS_ADDR
              value: "redis:6379"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"